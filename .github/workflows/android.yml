name: FlorisBoard CI

on:
  workflow_dispatch:
  push:
    branches: [ main, "hackathon/**" ]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/FUNDING.yml"
      - ".dockerignore"
      - ".editorconfig"
      - "fastlane/**"
      - "AI_POLICY.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "ROADMAP.md"
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2
      - name: Build with Gradle
        run: ./gradlew clean assembleDebug
        env:
          HUSHH_MONEY_API: ${{ vars.HUSHH_MONEY_API }}
          HUSHH_DARAJA_KEY: ${{ secrets.HUSHH_DARAJA_KEY }}
          HUSHH_DARAJA_SECRET: ${{ secrets.HUSHH_DARAJA_SECRET }}
          HUSHH_DARAJA_PASSKEY: ${{ secrets.HUSHH_DARAJA_PASSKEY }}
      - name: Money routing tests
        run: ./gradlew :app:testDebugUnitTest --tests 'dev.patrickgold.florisboard.money.*'
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  nlp-tests:
    # Fast feedback for the HushhBoard word engine (pure Kotlin, runs in ~2-3 min).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Word engine tests
        run: ./gradlew :lib:nlp:test --no-daemon
      - name: Report word engine latency
        if: always()
        run: grep -ho 'HUSHH_PERF[^<]*' lib/nlp/build/test-results/test/*.xml | sed 's/^/::notice title=Word engine latency::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nlp-test-report
          path: lib/nlp/build/reports/tests/test

  money-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests
        working-directory: server
        run: npm install && npm test
